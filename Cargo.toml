[package]
name = "galaxyd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small Ansible Galaxy-compatible collection server"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x", "sigv4a"] }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-core = "0.3"
http = "1"
jsonwebtoken = "9"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
prometheus-client = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "1"
sha2 = "0.11"
subtle = "2"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[[bin]]
name = "galaxyd"
path = "src/main.rs"
