server:
  listen: 0.0.0.0:8080
  observability_listen: 127.0.0.1:9090
  public_url: https://galaxy.example.org
  ui_enabled: true

auth:
  enabled: true
  session_ttl_seconds: 28800
  local:
    enabled: true
    users_file: /etc/galaxyd/admins.users

storage:
  type: local
  path: /var/lib/galaxyd

network:
  set_real_ip_from: [] # Add only exact reverse-proxy addresses used in deployment.
  max_upload_bytes: 134217728
  max_forwarded_for_hops: 16

token_dir: /etc/galaxyd/tokens

namespaces:
  - name: engineering
    push_networks:
      - 10.20.0.0/16
  - name: platform
    push_networks: []
