server:
  listen: 0.0.0.0:8080
  observability_listen: 127.0.0.1:9090
  public_url: https://galaxy.example.org
  ui_enabled: true

auth:
  enabled: true
  session_ttl_seconds: 28800
  oidc:
    enabled: true
    debug: false
    request_offline_access: true
    refresh_interval_seconds: 300
    issuer_url: https://login.example.org/realms/company
    client_id: galaxyd
    client_secret_file: /etc/galaxyd/oidc-client.secret
    display_name: Company SSO
    groups_claim: groups
    group_mappings:
      - group: galaxy-administrators
        admin: true
      - group: galaxy-engineering
        namespaces:
          - engineering
      - group: galaxy-platform
        namespaces:
          - platform

storage:
  type: local
  path: /var/lib/galaxyd

network:
  set_real_ip_from: [] # Add only exact reverse-proxy addresses used in deployment.
  max_upload_bytes: 134217728
  max_forwarded_for_hops: 16

token_dir: /etc/galaxyd/tokens

namespaces:
  - name: engineering
    push_networks:
      - 10.20.0.0/16
  - name: platform
    push_networks: []
