# Example with global authorization and local administrator login.
# Generate an Argon2id hash with:
#   printf '%s\n' 'change-me' | galaxyd password-hash
# Then put it in /etc/galaxyd/admins.users as username:hash.

token_dir = "/etc/galaxyd/tokens"

[server]
listen = "0.0.0.0:8080"
observability_listen = "0.0.0.0:9090"
public_url = "https://galaxy.example.org"
ui_enabled = true

[auth]
enabled = true
session_ttl_seconds = 28800

[auth.local]
enabled = true
users_file = "/etc/galaxyd/admins.users"

[storage]
type = "local"
path = "/var/lib/galaxyd"

[network]
set_real_ip_from = ["127.0.0.1/32", "10.0.0.0/8"]
max_upload_bytes = 134217728
max_forwarded_for_hops = 16

[[namespaces]]
name = "engineering"
push_networks = ["10.20.0.0/16"]

[[namespaces]]
name = "platform"
push_networks = []
