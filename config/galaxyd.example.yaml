# Public mirror example: auth.enabled=false makes collection data public.
server:
  listen: 0.0.0.0:8080
  observability_listen: 127.0.0.1:9090
  public_url: http://localhost:8080
  ui_enabled: true
auth:
  enabled: false
  session_ttl_seconds: 28800
storage:
  type: local
  path: /var/lib/galaxyd
network:
  set_real_ip_from: [] # Add only exact reverse-proxy addresses used in deployment.
  max_upload_bytes: 134217728
  max_forwarded_for_hops: 16
namespaces:
  - name: engineering
    push_networks:
      - 10.20.0.0/16
