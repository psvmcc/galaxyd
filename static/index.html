<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>galaxyd</title>
  <style>
    :root {
      --bg: #f7f4ed; --surface: #ffffff; --surface-raised: #f1ede4;
      --text: #34302f; --muted: #706960; --namespace: #81786e; --namespace-separator: #aaa095; --border: #ddd6c8;
      --accent: #b85c00; --accent-soft: #d79921; --green: #6b7d2a;
      --red: #b23c2f; --shadow: 0 2px 8px #34302f1a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #242424; --surface: #2d2f30; --surface-raised: #383a3b;
        --text: #e6e1d5; --muted: #aaa49a; --namespace: #938d84; --namespace-separator: #77736d; --border: #4b4d4f;
        --accent: #c56a16; --accent-soft: #d18a28; --green: #879b43;
        --red: #c45a4f; --shadow: 0 2px 8px #0005;
      }
    }
    :root[data-theme="dark"] {
      --bg: #242424; --surface: #2d2f30; --surface-raised: #383a3b;
      --text: #e6e1d5; --muted: #aaa49a; --namespace: #938d84; --namespace-separator: #77736d; --border: #4b4d4f;
      --accent: #c56a16; --accent-soft: #d18a28; --green: #879b43;
      --red: #c45a4f; --shadow: 0 2px 8px #0005;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .page { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 58px; }
    .auth-status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .auth-status.admin-mode::before { content: "[admin mode]"; color: var(--red); font-size: 11px; font-weight: 700; }
    .auth-icon { display: inline-flex; width: 16px; height: 16px; color: var(--muted); }
    .auth-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .auth-status button { border: 1px solid var(--border); border-radius: 4px; padding: 5px 9px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
    .bottom-auth button { padding: 3px 6px; font-size: 12px; }
    .auth-status button:hover { border-color: var(--accent); background: var(--surface-raised); }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    .bottom-bar { position: fixed; inset: auto 0 0; z-index: 20; height: 34px; background: var(--bg); border-top: 1px solid var(--border); box-shadow: 0 -5px 18px #3c38361a; }
    .theme { position: absolute; left: 20px; top: 50%; z-index: 21; display: flex; align-items: center; gap: 2px; color: var(--muted); font-size: 12px; opacity: .78; transform: translateY(-50%); }
    .bottom-auth { position: absolute; right: 20px; top: 50%; z-index: 21; transform: translateY(-50%); }
    select, input { border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--text); padding: 8px 10px; font: inherit; }
    .theme button { display: inline-block; flex: 0 0 30px; width: 30px; height: 30px; padding: 0; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font: 20px/1 inherit; }
    .theme button:hover, .theme button.active { color: var(--text); background: var(--surface-raised); border-color: var(--border); }
    .theme button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
    .theme button svg { display: block; width: 20px; height: 20px; margin: auto; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .theme button svg .system-fill { fill: currentColor; stroke: none; }
    select:focus, input:focus { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); }
    .box-title { padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; }
    .namespaces { padding: 8px; }
    .namespace { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); text-align: left; cursor: pointer; font: inherit; }
    .namespace:hover, .namespace.active { background: var(--surface-raised); color: var(--text); }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toolbar input { flex: 1; min-width: 0; }
    .status { min-height: 24px; margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .collections { display: grid; gap: 6px; }
    .collection-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-raised); color: inherit; text-align: left; font: inherit; cursor: pointer; }
    .collection-row:hover { border-color: var(--accent); }
    .collection-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .collection-name .namespace-name { color: var(--namespace); }
    .collection-name .namespace-separator { color: var(--namespace-separator); }
    .collection-version-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .version { color: var(--green); font-size: 14px; font-weight: 700; white-space: nowrap; }
    .collection-latest { color: var(--green); font-size: 13px; white-space: nowrap; }
    .version-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .version-row:last-child { border-bottom: 0; }
    .version-identity { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
    .version-identity .collection-name { color: var(--muted); }
    .published-at { color: var(--muted); opacity: .68; font-size: 12px; font-weight: 400; white-space: nowrap; }
    .download { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 4px; color: var(--accent); }
    .download:hover { background: var(--surface-raised); color: var(--text); }
    .download:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
    .download svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .back { margin-bottom: 10px; border: 0; background: transparent; color: var(--accent); cursor: pointer; font: inherit; padding: 4px 0; }
    .empty { padding: 20px 10px; color: var(--muted); text-align: center; }
    footer { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; white-space: nowrap; pointer-events: none; }
    @media (max-width: 680px) { .page { width: min(100% - 20px, 520px); padding-top: 16px; padding-bottom: 58px; } .layout { grid-template-columns: 1fr; gap: 16px; } .namespaces { display: flex; gap: 4px; overflow-x: auto; } .namespace { width: auto; white-space: nowrap; } .theme { left: 10px; } .bottom-auth { right: 10px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="layout">
      <aside class="box"><div class="box-title">Namespaces <span id="namespace-count"></span></div><div class="namespaces" id="namespaces"><div class="empty">Loading…</div></div></aside>
      <section>
        <div class="toolbar"><input id="search" type="search" placeholder="Search collections" autocomplete="off"></div>
        <div id="status" class="status">Loading collections…</div>
        <div id="collections" class="collections"></div>
      </section>
    </section>
  </main>
  <div class="bottom-bar"><footer>Powered by galaxyd</footer><div class="theme" aria-label="Theme"><button type="button" data-theme="system" aria-label="Use system theme" title="System"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="system-fill" d="M12 4a8 8 0 0 0 0 16Z"/><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button><button type="button" data-theme="light" aria-label="Use light theme" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/></svg></button><button type="button" data-theme="dark" aria-label="Use dark theme" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 15.5A8 8 0 0 1 8.5 4.5 8.5 8.5 0 1 0 19.5 15.5Z"/></svg></button></div><div class="auth-status bottom-auth" aria-live="polite"><span id="auth-icon" class="auth-icon" hidden></span><span id="auth-label">Checking access…</span><button id="logout" type="button" hidden>Logout</button></div></div>
  <script>
    const root = document.documentElement;
    const themeButtons = document.querySelectorAll('[data-theme]');
    const savedTheme = localStorage.getItem('galaxyd-theme') || 'system';
    themeButtons.forEach(button => button.classList.toggle('active', button.dataset.theme === savedTheme));
    if (savedTheme !== 'system') root.dataset.theme = savedTheme;
    themeButtons.forEach(button => button.addEventListener('click', () => { const value = button.dataset.theme; localStorage.setItem('galaxyd-theme', value); themeButtons.forEach(item => item.classList.toggle('active', item === button)); if (value === 'system') delete root.dataset.theme; else root.dataset.theme = value; }));

    const htmlTitle = document.querySelector('title');
    const namespaces = document.querySelector('#namespaces');
    const collections = document.querySelector('#collections');
    const search = document.querySelector('#search');
    const status = document.querySelector('#status');
    const authLabel = document.querySelector('#auth-label');
    const authIcon = document.querySelector('#auth-icon');
    const logout = document.querySelector('#logout');
    const sharedUrl = new URL(window.location.href);
    let selectedNamespace = sharedUrl.searchParams.get('namespace') || '';
    let selectedCollection = sharedUrl.searchParams.get('collection') || '';
    const baseTitle = 'galaxyd';
    function setPageTitle(value) { const title = value ? `${baseTitle} - ${value}` : baseTitle; htmlTitle.textContent = title; document.title = title; }
    function updateUrl() { const url = new URL(window.location.href); if (selectedNamespace) url.searchParams.set('namespace', selectedNamespace); else url.searchParams.delete('namespace'); if (selectedCollection) url.searchParams.set('collection', selectedCollection); else url.searchParams.delete('collection'); window.location.assign(url.toString()); }
    function applyTitle() { setPageTitle(selectedCollection && selectedNamespace ? `${selectedNamespace}.${selectedCollection}` : selectedNamespace); }
    const text = value => String(value ?? '');
    const rfc3339Seconds = date => date.toISOString().replace(/\.\d{3}Z$/, 'Z');
    function collectionName(namespace, name) { const element = document.createElement('span'); element.className = 'collection-name'; const namespacePart = document.createElement('span'); namespacePart.className = 'namespace-name'; namespacePart.textContent = text(namespace); const separator = document.createElement('span'); separator.className = 'namespace-separator'; separator.textContent = '.'; const collectionPart = document.createElement('span'); collectionPart.className = 'collection-part'; collectionPart.textContent = text(name); element.append(namespacePart, separator, collectionPart); return element; }
    async function api(path) { const response = await fetch(path); if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }
    async function apiAll(path) { const items = []; let next = path; while (next) { const result = await api(next); items.push(...(result.data || [])); next = result.links && result.links.next ? result.links.next : null; } return items; }
    const authStatus = document.querySelector('.auth-status');
    async function loadAuthStatus() { try { const result = await api('/auth/status'); authStatus.classList.toggle('admin-mode', result.authenticated === true && result.admin === true); if (!result.enabled) { authLabel.textContent = '@anonymous'; return; } if (result.authenticated) { const isOidc = result.auth_source === 'oidc'; const sourceLabel = isOidc ? 'OIDC user' : 'Local user'; const username = result.username || 'user'; authLabel.textContent = username.startsWith('@') ? username : `@${username}`; authLabel.title = sourceLabel; authLabel.setAttribute('aria-label', `${authLabel.textContent} (${sourceLabel})`); authIcon.innerHTML = isOidc ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 8.5 4.5 4.5 0 0 0 7 18Z"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.8-1.4 1.8-2 3-2s2.2.6 3 2M15 10h3M15 14h3"/></svg>'; authIcon.title = sourceLabel; authIcon.setAttribute('aria-label', sourceLabel); authIcon.hidden = false; logout.hidden = false; return; } authLabel.textContent = 'Not signed in'; } catch (error) { authStatus.classList.remove('admin-mode'); authLabel.textContent = 'Access status unavailable'; } }
    logout.addEventListener('click', async () => { logout.disabled = true; try { await fetch('/auth/logout', { method: 'POST' }); } finally { window.location.assign('/'); } });
    function compareSemver(left, right) { const parse = value => { const match = text(value).match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/); if (!match) return null; return [Number(match[1]), Number(match[2]), Number(match[3]), match[4] ? match[4].split('.') : null]; }; const a = parse(left), b = parse(right); if (!a || !b) return text(left).localeCompare(text(right)); for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] - b[i]; if (!a[3] && !b[3]) return 0; if (!a[3]) return 1; if (!b[3]) return -1; for (let i = 0; i < Math.max(a[3].length, b[3].length); i += 1) { if (a[3][i] === undefined) return -1; if (b[3][i] === undefined) return 1; const an = /^\d+$/.test(a[3][i]), bn = /^\d+$/.test(b[3][i]); if (an && bn && Number(a[3][i]) !== Number(b[3][i])) return Number(a[3][i]) - Number(b[3][i]); if (an !== bn) return an ? -1 : 1; if (a[3][i] !== b[3][i]) return a[3][i].localeCompare(b[3][i]); } return 0; }
    function renderCollectionList(items) { const grouped = new Map(); items.forEach(item => { const key = `${text(item.namespace)}\u0000${text(item.name)}`; if (!grouped.has(key)) grouped.set(key, []); grouped.get(key).push(item); }); const rows = [...grouped.values()].map(versions => { versions.sort((a, b) => compareSemver(text(b.version), text(a.version))); const item = versions[0]; const row = document.createElement('button'); row.type = 'button'; row.className = 'collection-row'; const name = collectionName(item.namespace, item.name); const count = document.createElement('span'); count.className = 'collection-version-count'; count.textContent = `${versions.length} version${versions.length === 1 ? '' : 's'}`; const latest = document.createElement('span'); latest.className = 'collection-latest'; latest.textContent = `v${text(item.version)}`; row.append(name, count, latest); row.onclick = () => { selectedNamespace = text(item.namespace); selectedCollection = text(item.name); updateUrl(); }; return row; }); collections.replaceChildren(...rows); }
    function browserDownloadUrl(link) { const url = new URL(link, window.location.href); return url.origin === window.location.origin ? url.href : `${url.pathname}${url.search}${url.hash}`; }
    async function downloadArchive(event, link, namespace, name, version) { event.preventDefault(); try { const response = await fetch(link, { credentials: 'same-origin' }); if (!response.ok) throw new Error(`HTTP ${response.status}`); const blob = await response.blob(); const disposition = response.headers.get('content-disposition') || ''; const match = disposition.match(/filename="([^"]+)"/i); const filename = match ? match[1] : `${namespace}-${name}-${version}.tar.gz`; const objectUrl = URL.createObjectURL(blob); const anchor = document.createElement('a'); anchor.href = objectUrl; anchor.download = filename; document.body.append(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(objectUrl), 1000); } catch (error) { status.textContent = `Could not download collection: ${error.message}`; } }
    function renderVersions(items) { const back = document.createElement('button'); back.type = 'button'; back.className = 'back'; back.textContent = '← All collections'; back.onclick = () => { selectedCollection = ''; updateUrl(); }; const rows = items.slice().sort((a, b) => compareSemver(text(b.version), text(a.version))).map(item => { const row = document.createElement('div'); row.className = 'version-row'; const identity = document.createElement('span'); identity.className = 'version-identity'; const name = collectionName(item.namespace, item.name); const version = document.createElement('strong'); version.className = 'version'; version.textContent = `v${text(item.version)}`; identity.append(name, version); const published = document.createElement('time'); published.className = 'published-at'; const publishedDate = typeof item.published_at === 'number' ? new Date(item.published_at * 1000) : new Date(text(item.published_at)); if (Number.isFinite(publishedDate.getTime())) { const publishedAt = rfc3339Seconds(publishedDate); published.dateTime = publishedAt; published.textContent = publishedAt; } else { published.textContent = 'Date unavailable'; } const download = document.createElement('a'); download.className = 'download'; download.setAttribute('aria-label', `Download ${text(item.namespace)}.${text(item.name)} v${text(item.version)}`); download.title = 'Download'; download.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>'; download.href = browserDownloadUrl(text(item.download_url)); download.addEventListener('click', event => downloadArchive(event, download.href, text(item.namespace), text(item.name), text(item.version))); row.append(identity, published, download); return row; }); collections.replaceChildren(back, ...rows); }
    let collectionRequest = 0;
    async function loadCollections() { const request = ++collectionRequest; status.textContent = 'Loading collections…'; try { const params = new URLSearchParams(); if (search.value) params.set('search', search.value); if (selectedNamespace) params.set('namespace', selectedNamespace); if (selectedCollection) params.set('collection', selectedCollection); const items = await apiAll('/api/galaxy/v3/collections?' + params); if (request !== collectionRequest) return; if (selectedCollection) { renderVersions(items); status.textContent = `${items.length} version(s)`; } else { renderCollectionList(items); status.textContent = `${new Set(items.map(item => `${text(item.namespace)}.${text(item.name)}`)).size} collection(s)`; } } catch (error) { if (request !== collectionRequest) return; collections.replaceChildren(); status.textContent = `Could not load collections: ${error.message}`; } }
    async function loadNamespaces() { try { const result = await api('/api/galaxy/v3/namespaces'); const items = result.data || []; document.querySelector('#namespace-count').textContent = `(${items.length})`; namespaces.replaceChildren(); const all = document.createElement('button'); all.className = `namespace${selectedNamespace ? '' : ' active'}`; all.textContent = 'All namespaces'; all.onclick = () => { selectedNamespace = ''; selectedCollection = ''; updateUrl(); applyTitle(); document.querySelectorAll('.namespace').forEach(item => item.classList.remove('active')); all.classList.add('active'); loadCollections(); }; namespaces.append(all); items.forEach(item => { const button = document.createElement('button'); button.className = `namespace${item.name === selectedNamespace ? ' active' : ''}`; button.dataset.namespace = item.name; button.textContent = text(item.name); button.onclick = () => { selectedNamespace = item.name; selectedCollection = ''; updateUrl(); applyTitle(); document.querySelectorAll('.namespace').forEach(entry => entry.classList.toggle('active', entry === button)); loadCollections(); }; namespaces.append(button); }); applyTitle(); } catch (error) { namespaces.replaceChildren(); const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = `Could not load namespaces: ${error.message}`; namespaces.append(empty); } }
    let timer; search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadCollections, 180); }); setPageTitle(selectedCollection && selectedNamespace ? `${selectedNamespace}.${selectedCollection}` : selectedNamespace); window.addEventListener('popstate', () => { const url = new URL(window.location.href); selectedNamespace = url.searchParams.get('namespace') || ''; selectedCollection = url.searchParams.get('collection') || ''; applyTitle(); loadNamespaces(); loadCollections(); }); loadAuthStatus(); loadNamespaces(); loadCollections();
  </script>
</body>
</html>
